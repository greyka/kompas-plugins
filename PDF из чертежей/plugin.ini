; Описание плагина для установщика (Установить.bat)
[plugin]
name = PDF из чертежей
library = CdwPdf.rtw
folder = Приложения
description = Чертежи КОМПАС (.cdw) → один PDF с закладками или один общий многолистовой чертёж. Исходные чертежи не изменяются.
; использует общие функции КОМПАС из плагина «Чертежи рам» (должен лежать рядом)
requires = Чертежи рам
